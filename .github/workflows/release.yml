# Builds a Windows version of FinSight with Java bundled in, so it runs
# without installing a JDK.
#
# Run it from the Actions tab (Release > Run workflow) with a version number,
# or push a tag like v1.0.0. Either way it publishes a GitHub Release with:
#   FinSight-<version>-windows.zip   portable: unzip and run FinSight.exe
#   FinSight-<version>-setup.exe     installer with Start menu and desktop shortcuts

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Work out version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Build and test
        run: ./mvnw -B package

      - name: Package app image
        run: |
          mkdir -p target/jp-input
          cp target/finsight.jar target/jp-input/
          jpackage --type app-image \
            --name FinSight \
            --input target/jp-input \
            --main-jar finsight.jar \
            --main-class com.finsight.Launcher \
            --dest target/dist \
            --icon packaging/finsight.ico \
            --app-version "$VERSION" \
            --vendor "Yash Jha" \
            --description "Personal finance manager" \
            --add-modules "$(cat packaging/modules.txt)" \
            --jlink-options "--strip-debug --no-man-pages --no-header-files"
          cd target/dist
          7z a -tzip "../FinSight-$VERSION-windows.zip" FinSight > /dev/null

      - name: Install WiX for the installer
        id: wix
        continue-on-error: true
        shell: pwsh
        run: choco install wixtoolset --version 3.14.1 -y --no-progress

      - name: Package installer
        if: steps.wix.outcome == 'success'
        continue-on-error: true
        run: |
          export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.14/bin"
          jpackage --type exe \
            --name FinSight \
            --app-image target/dist/FinSight \
            --dest target/installer \
            --app-version "$VERSION" \
            --vendor "Yash Jha" \
            --win-menu --win-shortcut --win-dir-chooser \
            --win-upgrade-uuid 6f0e3b2a-6c1d-4a59-9a8e-3f1f2c6a9d41
          mv target/installer/*.exe "target/FinSight-$VERSION-setup.exe"

      - name: Attach to run
        uses: actions/upload-artifact@v4
        with:
          name: FinSight-windows
          path: |
            target/FinSight-*-windows.zip
            target/FinSight-*-setup.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: FinSight ${{ env.VERSION }}
          body: |
            **Windows, no Java needed**

            - `FinSight-${{ env.VERSION }}-setup.exe`: installer with Start menu and desktop shortcuts.
            - `FinSight-${{ env.VERSION }}-windows.zip`: portable. Unzip anywhere and run `FinSight\FinSight.exe`.

            Windows may show a SmartScreen warning because the app isn't code-signed. Click **More info**, then **Run anyway**.

            Data is stored in `%USERPROFILE%\.finsight\finsight.db`.
          files: |
            target/FinSight-*-windows.zip
            target/FinSight-*-setup.exe
          fail_on_unmatched_files: false
